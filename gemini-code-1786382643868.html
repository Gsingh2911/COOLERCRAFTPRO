  <!-- SCRIPT ENGINE -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBF6Q2tzO2c6btMmiuNKYChLjIxE9e3nPU",
      authDomain: "coolercraftpro.firebaseapp.com",
      projectId: "coolercraftpro",
      storageBucket: "coolercraftpro.firebasestorage.app",
      messagingSenderId: "14162139652",
      appId: "1:14162139652:web:e6149317962d123489b351",
      measurementId: "G-DWXEQQVSZR"
    };

    let cloudDb = null;
    try {
      firebase.initializeApp(firebaseConfig);
      cloudDb = firebase.firestore();
    } catch(e) {}

    const DB_NAME = 'CoolerCraftProDB_CloudOriginal';
    const DB_Version = 9;
    let db = null;

    const DEFAULT_STORES = ['motors', 'outsourcedMotors', 'coolers', 'customers', 'serviceTickets', 'replacementInventory', 'complaintTypes', 'auditLogs', 'users'];

    function initDB() {
      return new Promise((resolve) => {
        const request = indexedDB.open(DB_NAME, DB_Version);
        request.onupgradeneeded = (e) => {
          const dbRef = e.target.result;
          DEFAULT_STORES.forEach(store => {
            if (!dbRef.objectStoreNames.contains(store)) {
              let keyPath = 'id';
              if (store === 'motors' || store === 'coolers') keyPath = 'sn';
              if (store === 'outsourcedMotors') keyPath = 'outSn';
              if (store === 'serviceTickets') keyPath = 'ticketNo';
              if (store === 'replacementInventory') keyPath = 'partCode';
              if (store === 'complaintTypes' || store === 'users') keyPath = 'name';
              if (store === 'customers') keyPath = 'mobile';
              dbRef.createObjectStore(store, { keyPath });
            }
          });
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(db); };
        request.onerror = () => { resolve(null); };
      });
    }

    async function dbGetAll(storeName) {
      if (!db) return [];
      try {
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch (err) { return []; }
    }

    async function dbPut(storeName, item) {
      if (!db) return;
      try {
        if (storeName === 'customers') {
          if (!item.mobile || item.mobile.trim() === '' || item.mobile === 'NA') {
            item.mobile = 'NA_' + Math.floor(Math.random()*8999+1000);
          } else {
            item.mobile = item.mobile.trim();
          }
        }
        await new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          const req = tx.objectStore(storeName).put(item);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        if (cloudDb) {
          const docKey = item.mobile || item.sn || item.outSn || item.ticketNo || item.partCode || item.name || 'doc_' + Date.now();
          cloudDb.collection(storeName).doc(String(docKey)).set(item).catch(()=>{});
        }
      } catch (err) {}
    }

    async function dbGet(storeName, key) {
      if (!db || !key) return null;
      try {
        return new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (err) { return null; }
    }

    async function dbDelete(storeName, key) {
      if (!db || !key) return;
      try {
        await new Promise((resolve) => {
          const tx = db.transaction(storeName, 'readwrite');
          const req = tx.objectStore(storeName).delete(key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        });
        if (cloudDb) {
          cloudDb.collection(storeName).doc(String(key)).delete().catch(()=>{});
        }
      } catch (err) {}
    }

    class EnterpriseApp {
      constructor() {
        this.currentView = 'dashboard';
        this.currentUser = null;
        this.currentRole = null;
        this.bulkMotorQueueList = [];
        this.bulkCoolerQueueList = [];
        this.bulkQCScannedList = [];
        this.activeScanTarget = null;
        this.html5QrScanner = null;
      }

      async init() {
        await initDB();
        await this.seedDefaultUsers();
        await this.seedDefaults();
      }

      // JSON Backup Restore Function
      async importBackupJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const backupData = JSON.parse(e.target.result);
            const stores = Object.keys(backupData);
            for (let storeName of stores) {
              if (DEFAULT_STORES.includes(storeName)) {
                const records = backupData[storeName];
                for (let record of records) {
                  await dbPut(storeName, record);
                }
              }
            }
            alert('Backup Restored Successfully! All data loaded.');
            window.location.reload();
          } catch (err) {
            alert('Invalid Backup JSON file format!');
          }
        };
        reader.readAsText(file);
      }

      async seedDefaultUsers() {
        const users = await dbGetAll('users');
        if (users.length === 0 || !users.some(u => u.name === 'admin')) {
          const defaultList = [
            { name: 'admin', pass: 'admin123', role: 'ADMIN', fullname: 'System Administrator' },
            { name: 'motor_team', pass: 'motor123', role: 'MOTOR_TEAM', fullname: 'Motor Production Lead' },
            { name: 'assembly_lead', pass: 'assembly123', role: 'ASSEMBLY_TEAM', fullname: 'Cooler Assembly Supervisor' },
            { name: 'tech_ramesh', pass: 'tech123', role: 'TECHNICIAN', fullname: 'Field Service Technician' }
          ];
          for (let u of defaultList) await dbPut('users', u);
        }
      }

      async seedDefaults() {
        const complaints = await dbGetAll('complaintTypes');
        if (complaints.length === 0) {
          const list = ['Motor Overheating', 'Water Pump Fail', 'Auto Swing Jam', 'Blade Noise', 'Capacitor Burnt'];
          for (let name of list) await dbPut('complaintTypes', { name });
        }
      }

      async handleLogin(e) {
        e.preventDefault();
        const role = document.getElementById('login-role').value;
        const username = document.getElementById('login-user').value.trim();
        const pass = document.getElementById('login-pass').value.trim();

        if (username === 'admin' && pass === 'admin123' && role === 'ADMIN') {
          this.currentUser = 'System Administrator';
          this.currentRole = 'ADMIN';
        } else {
          const userRecord = await dbGet('users', username);
          if (userRecord && userRecord.pass === pass && userRecord.role === role) {
            this.currentUser = userRecord.fullname;
            this.currentRole = userRecord.role;
          }
        }

        if (this.currentUser) {
          document.getElementById('auth-overlay').classList.add('hidden');
          document.getElementById('app-container').classList.remove('hidden');
          document.getElementById('current-user-display').innerText = `${this.currentUser} (${this.getRoleLabel(this.currentRole)})`;
          
          this.renderSidebarNav();
          this.renderMobileNav();
          this.navigate('dashboard');
        } else {
          alert('Invalid Username, Password, or Role Designation!');
        }
      }

      logout() {
        this.currentUser = null;
        this.currentRole = null;
        document.getElementById('app-container').classList.add('hidden');
        document.getElementById('auth-overlay').classList.remove('hidden');
        document.getElementById('login-user').value = 'admin';
        document.getElementById('login-pass').value = 'admin123';
      }

      showPasswordResetModal() {
        document.getElementById('dynamic-modal-container').innerHTML = `
          <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[9999] flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
              <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-sm text-sky-400">Password Reset Portal</h3>
                <button onclick="app.closeModal()"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <form onsubmit="app.executePasswordReset(event)" class="space-y-3 text-xs">
                <div><label class="block mb-1 font-semibold">Username / Employee ID *</label><input type="text" id="pr-user" required placeholder="Enter username..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 font-mono"></div>
                <div><label class="block mb-1 font-semibold">New Secure Password *</label><input type="password" id="pr-pass" required placeholder="Enter new password..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5"></div>
                <button type="submit" class="w-full py-2.5 bg-sky-600 hover:bg-sky-500 font-bold rounded-xl text-white">Update Password & Login</button>
              </form>
            </div>
          </div>
        `;
      }

      async executePasswordReset(e) {
        e.preventDefault();
        const username = document.getElementById('pr-user').value.trim();
        const newPass = document.getElementById('pr-pass').value.trim();

        let userRecord = await dbGet('users', username);
        if (userRecord) {
          userRecord.pass = newPass;
          await dbPut('users', userRecord);
          alert('Password successfully reset! Please login with your new credentials.');
          this.closeModal();
        } else {
          alert('User ID not found in system directory.');
        }
      }

      getRoleLabel(role) {
        switch(role) {
          case 'ADMIN': return 'Administrator';
          case 'MOTOR_TEAM': return 'Motor Production';
          case 'ASSEMBLY_TEAM': return 'Cooler Assembly';
          case 'TECHNICIAN': return 'Field Technician';
          default: return 'User';
        }
      }

      getNavModules() {
        let modules = [{ id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' }];
        
        if (this.currentRole === 'ADMIN' || this.currentRole === 'MOTOR_TEAM') {
          modules.push({ id: 'motor-prod', label: 'Motor Production', icon: 'fa-industry' });
          modules.push({ id: 'outsourced-motors', label: 'Outsourced Motors', icon: 'fa-truck-field' });
          modules.push({ id: 'motor-qc', label: 'Bulk Motor Testing & QC', icon: 'fa-microchip' });
        }

        if (this.currentRole === 'ADMIN' || this.currentRole === 'ASSEMBLY_TEAM') {
          modules.push({ id: 'cooler-prod', label: 'Cooler Assembly', icon: 'fa-box' });
          modules.push({ id: 'cooler-qc', label: 'Cooler Final QC', icon: 'fa-vial-circle-check' });
        }

        if (this.currentRole === 'ADMIN' || this.currentRole === 'TECHNICIAN') {
          modules.push({ id: 'service', label: 'Service & Retrofit SN', icon: 'fa-screwdriver-wrench' });
          modules.push({ id: 'customers', label: 'Customer Directory', icon: 'fa-users' });
          modules.push({ id: 'inventory', label: 'Replacement Parts', icon: 'fa-boxes-stacked' });
        }

        return modules;
      }

      renderSidebarNav() {
        const navContainer = document.getElementById('sidebar-nav');
        if (!navContainer) return;
        navContainer.innerHTML = this.getNavModules().map(m => `
          <button onclick="app.navigate('${m.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium transition ${this.currentView === m.id ? 'bg-sky-600/20 text-sky-400 border border-sky-500/30' : 'text-slate-400 hover:bg-slate-800/60'}">
            <i class="fa-solid ${m.icon} w-5 text-center text-sm"></i>
            <span>${m.label}</span>
          </button>
        `).join('');
      }

      renderMobileNav() {
        const bar = document.getElementById('mobile-nav-bar');
        if (!bar) return;
        const modules = this.getNavModules().slice(0, 4);
        bar.innerHTML = modules.map(m => `
          <button onclick="app.navigate('${m.id}')" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-sky-400 text-[10px] space-y-1">
            <i class="fa-solid ${m.icon} text-base"></i><span>${m.label.split(' ')[0]}</span>
          </button>
        `).join('') + `
          <button onclick="app.openScannerModal()" class="flex flex-col items-center justify-center w-full h-full text-sky-400 text-[10px]">
            <div class="w-10 h-10 rounded-full bg-sky-500 text-slate-950 flex items-center justify-center shadow-lg -mt-4 border-2 border-slate-900">
              <i class="fa-solid fa-qrcode text-lg"></i>
            </div>
          </button>
        `;
      }

      async navigate(viewId) {
        this.currentView = viewId;
        this.renderSidebarNav();
        const content = document.getElementById('content-area');
        if (!content) return;
        content.innerHTML = `<div class="p-8 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-xl"></i></div>`;

        switch (viewId) {
          case 'dashboard': await this.renderDashboard(content); break;
          case 'motor-prod': await this.renderMotorProd(content); break;

      addMotorToBatchQueue() {
        const inputField = document.getElementById('bm-scan-input');
        const val = inputField.value.trim();
        if (!val) { alert('Please enter or scan a serial number first.'); return; }
        if (this.bulkMotorQueueList.includes(val)) { alert('This Serial Number is already in the queue.'); return; }
        this.bulkMotorQueueList.push(val);
        inputField.value = '';
        inputField.focus();
        this.renderBatchQueueChips();
      }

      renderBatchQueueChips() {
        const container = document.getElementById('bm-queue-chips');
        const countSpan = document.getElementById('bm-queue-count');
        if (!container || !countSpan) return;
        countSpan.innerText = this.bulkMotorQueueList.length;
        if (this.bulkMotorQueueList.length === 0) {
          container.innerHTML = `<span class="text-slate-500 italic text-[11px]">No motors added yet. Scan multiple tags one by one.</span>`;
          return;
        }
        container.innerHTML = this.bulkMotorQueueList.map(sn => `
          <span class="px-2 py-1 bg-sky-950 border border-sky-800 text-sky-300 rounded-lg text-xs font-mono font-bold flex items-center gap-2">
            <span>${sn}</span>
            <button onclick="app.removeMotorFromBatchQueue('${sn}')" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-xmark"></i></button>
          </span>
        `).join('');
      }

      removeMotorFromBatchQueue(sn) {
        this.bulkMotorQueueList = this.bulkMotorQueueList.filter(s => s !== sn);
        this.renderBatchQueueChips();
      }

      async saveQueueBatchMotors() {
        if (this.bulkMotorQueueList.length === 0) { alert('Please add at least one motor to the queue.'); return; }
        const model = document.getElementById('bm-model').value;
        const material = document.getElementById('bm-material').value;

        for (let sn of this.bulkMotorQueueList) {
          await dbPut('motors', { sn, model, stackSize: '25mm', material, usageType: 'Fitting in Cooler', coolerSn: null, qcStatus: 'PASS', date: new Date().toISOString().split('T')[0] });
        }
        alert(`Successfully Saved and Synced ${this.bulkMotorQueueList.length} Motors!`);
        this.bulkMotorQueueList = [];
        this.closeModal();
        this.navigate('motor-prod');
      }

            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-bold text-sm">Service Tickets & Replaced Component Tracking (Technician Portal)</h3>
                <p class="text-[11px] text-slate-400">Track ticket status (Pending / Completed), time stamps, and automated customer notifications.</p>
              </div>
              <button onclick="app.showRetrofitServiceModal()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs rounded-xl text-white">+ Raise Service Ticket</button>
            </div>
            <div class="space-y-2">
              ${tickets.map(t => {
                let statusBadge = t.status === 'COMPLETED' 
                  ? `<span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 font-bold text-[10px]">COMPLETED</span>` 
                  : `<span class="px-2 py-0.5 rounded bg-amber-950 text-amber-400 font-bold text-[10px]">PENDING</span>`;
                return `
                  <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs flex justify-between items-center">
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="font-bold text-sky-400 font-mono">${t.ticketNo}</span> 
                        ${statusBadge}
                      </div>
                      <p class="text-slate-300 mt-1">Phone: <strong class="text-emerald-400 font-mono text-sm">${t.mobile}</strong> | Customer: ${t.customerName}</p>
                      <p class="text-slate-400 text-[11px]">Raised At: ${t.createdAt || 'N/A'} | Closed At: ${t.closedAt || 'In Progress'}</p>
                      <p class="text-amber-400 text-[11px] mt-0.5 font-semibold">Complaint: ${t.complaintType} | Replaced: <strong>${t.componentName || 'Motor'}</strong></p>
                    </div>
                    <div class="flex gap-1">
                      <button onclick="app.toggleTicketStatus('${t.ticketNo}')" class="p-2 bg-indigo-900 text-indigo-200 rounded font-bold text-[10px]" title="Toggle Pending/Complete">Toggle Status</button>
                      <button onclick="app.sendWhatsAppNotification('${t.mobile}', '${t.coolerSn}', '${t.ticketNo}', '${t.status}')" class="p-2 bg-emerald-900 text-emerald-300 rounded" title="Send WhatsApp Message with Time"><i class="fa-brands fa-whatsapp"></i></button>
                      <button onclick="app.showRetrofitServiceModal('${t.ticketNo}')" title="Edit Ticket" class="p-2 bg-amber-950 text-amber-400 rounded"><i class="fa-solid fa-pen-to-square"></i></button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      async toggleTicketStatus(ticketNo) {
        let t = await dbGet('serviceTickets', ticketNo);
        if (t) {
          if (t.status === 'COMPLETED') {
            t.status = 'PENDING';
            t.closedAt = 'In Progress';
          } else {
            t.status = 'COMPLETED';
            t.closedAt = new Date().toLocaleString();
          }
          await dbPut('serviceTickets', t);
          this.navigate('service');
        }
      }

      sendWhatsAppNotification(mobile, serviceCode, ticketNo, status) {
        const timeNow = new Date().toLocaleString();
        let msg = status === 'COMPLETED'
          ? encodeURIComponent(`Hello! Your Cooler Service Ticket (${ticketNo}) for Unit ${serviceCode} has been successfully COMPLETED and closed at ${timeNow}. Thank you!`)
          : encodeURIComponent(`Hello! Your Cooler Service Ticket (${ticketNo}) for Unit ${serviceCode} has been successfully REGISTERED/PENDING as of ${timeNow}. Our technician will update you soon.`);
        window.open(`https://wa.me/91${mobile}?text=${msg}`, '_blank');
      }

      async showRetrofitServiceModal(editTicketNo = null) {
        let existing = editTicketNo ? await dbGet('serviceTickets', editTicketNo) : null;
        const todayStr = new Date().toISOString().split('T')[0];
        const complaints = await dbGetAll('complaintTypes');
        
        const inhouse = await dbGetAll('motors');
        const outsourced = await dbGetAll('outsourcedMotors');
        const freeMotors = [
          ...inhouse.filter(m => !m.coolerSn).map(m => ({ sn: m.sn, name: `${m.model} (In-House)` })),
          ...outsourced.filter(o => !o.coolerSn).map(o => ({ sn: o.outSn, name: `${o.model} (${o.vendorName})` }))
        ];

        document.getElementById('dynamic-modal-container').innerHTML = `
          <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 space-y-3 max-h-[90vh] overflow-y-auto">
              <div class="flex justify-between border-b border-slate-800 pb-2"><h3 class="font-bold text-sm">${existing ? 'Edit Service Ticket Details' : 'Raise Service & Generate Serial Code'}</h3><button onclick="app.closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
              <form onsubmit="app.saveRetrofitServiceRequest(event, ${existing ? `'${existing.ticketNo}'` : 'null'})" class="space-y-3 text-xs">
                <div><label class="block mb-1">Customer Name *</label><input type="text" id="sr-cname" value="${existing ? existing.customerName : ''}" placeholder="e.g. Ramesh Kumar" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 font-bold"></div>
                <div class="grid grid-cols-2 gap-2">
                  <div><label class="block mb-1 font-bold text-emerald-400">Mobile Number (Primary ID) *</label><input type="text" id="sr-mobile" value="${existing ? existing.mobile : ''}" required placeholder="9502229213" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 font-mono font-bold text-emerald-400"></div>
                  <div><label class="block mb-1">Purchase Date *</label><input type="date" id="sr-pdate" value="${existing ? existing.purchaseDate : todayStr}" onchange="app.previewGeneratedSN()" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2"></div>
                </div>
                <div><label class="block mb-1">Cooler Model Name</label><input type="text" id="sr-model" value="${existing ? (existing.coolerModel || 'Novetech Air Cooler 70L') : 'Novetech Air Cooler 70L'}" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2"></div>
                
                <div class="p-2.5 bg-slate-950 border border-emerald-900 rounded-xl">
                  <span class="text-[10px] text-slate-400">Generated Cooler Serial Number:</span>
                  <p id="sr-sn-preview" class="font-mono font-bold text-emerald-400 text-sm mt-0.5">${existing ? existing.coolerSn : 'CLR-20260810-961'}</p>
                </div>

                <div>
                  <div class="flex justify-between mb-1"><label>Complaint Type</label><button type="button" onclick="app.addNewComplaintType()" class="text-sky-400 underline">+ Add Type</button></div>
                  <select id="sr-complaint" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2">${complaints.map(c => `<option ${existing && existing.complaintType===c.name?'selected':''}>${c.name}</option>`).join('')}</select>
                </div>

                <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                  <span class="font-bold text-amber-400">Auto-Fetch Replacement Stock Motor/Part</span>
                  <div>
                    <label class="block text-slate-400 mb-1">Select Free Available Motor *</label>
                    <select id="sr-inventory-fetch" onchange="document.getElementById('sr-newsn').value=this.value" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 font-bold text-emerald-400">
                      <option value="">-- Choose Free Motor to Issue --</option>
                      ${freeMotors.map(fm => `<option value="${fm.sn}">${fm.name} [SN: ${fm.sn}]</option>`).join('')}
                    </select>
                  </div>

                  <div>
                    <label class="block text-slate-300 font-semibold mb-1">Main Component Name *</label>
                    <input type="text" id="sr-comp-name" value="${existing ? (existing.componentName || 'Cooler Motor Assembly') : 'Cooler Motor Assembly'}" required class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-100 font-bold">
                  </div>
                  <div>
                    <label class="block text-slate-400 mb-1">Defective Old Part SN (Scan Barcode)</label>
                    <div class="flex gap-2">
                      <input type="text" id="sr-oldsn" value="${existing ? (existing.oldPartSn || '') : ''}" placeholder="OLD-PART-2026" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-rose-300 font-mono">
                      <button type="button" onclick="app.openScannerModal('sr-oldsn')" class="px-2 py-1 bg-sky-600 text-white rounded text-[10px]"><i class="fa-solid fa-camera"></i> Scan</button>
                    </div>
                  </div>
                  <div>
                    <label class="block text-slate-400 mb-1">New Issued Part SN (Scan Barcode)</label>
                    <div class="flex gap-2">
                      <input type="text" id="sr-newsn" value="${existing ? (existing.newPartSn || '') : ''}" placeholder="NEW-PART-2026" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-emerald-300 font-mono">
                      <button type="button" onclick="app.openScannerModal('sr-newsn')" class="px-2 py-1 bg-sky-600 text-white rounded text-[10px]"><i class="fa-solid fa-camera"></i> Scan</button>
                    </div>
                  </div>
                </div>

                <button type="submit" class="w-full py-2.5 bg-emerald-600 font-bold rounded-xl text-white mt-2">${existing ? 'Update Service Ticket' : 'Raise Service Ticket & Notify'}</button>
              </form>
            </div>
          </div>
        `;
        if (!existing) this.previewGeneratedSN();
      }

      async addNewComplaintType() {
        const val = prompt('Enter New Complaint Description:');
        if (val && val.trim()) {
          await dbPut('complaintTypes', { name: val.trim() });
          this.showRetrofitServiceModal();
        }
      }

      previewGeneratedSN() {
        const pdate = document.getElementById('sr-pdate')?.value || new Date().toISOString().split('T')[0];
        const cleanDate = pdate.replace(/-/g, '');
        const randomCode = Math.floor(Math.random() * 899 + 100);
        const generatedSN = `CLR-${cleanDate}-${randomCode}`;
        const preview = document.getElementById('sr-sn-preview');
        if (preview) preview.innerText = generatedSN;
      }

      async saveRetrofitServiceRequest(e, editTicketNo = null) {
        e.preventDefault();
        const generatedSN = document.getElementById('sr-sn-preview').innerText;
        const cname = document.getElementById('sr-cname').value;
        const mobile = document.getElementById('sr-mobile').value.trim();
        const pdate = document.getElementById('sr-pdate').value;

        const ticketKey = editTicketNo ? editTicketNo : ('TCK-' + Math.floor(Math.random() * 899 + 100));
        const timestampNow = new Date().toLocaleString();

        await dbPut('serviceTickets', {
          ticketNo: ticketKey, coolerSn: generatedSN, customerName: cname, mobile: mobile, purchaseDate: pdate, coolerModel: document.getElementById('sr-model').value, complaintType: document.getElementById('sr-complaint').value, componentName: document.getElementById('sr-comp-name').value, oldPartSn: document.getElementById('sr-oldsn').value || 'DEF-2026', newPartSn: document.getElementById('sr-newsn').value || 'NEW-2026', status: 'PENDING', createdAt: timestampNow, closedAt: 'In Progress'
        });

        await dbPut('customers', { mobile: mobile, name: cname, coolerSn: generatedSN, purchaseDate: pdate, type: 'Retailer' });
        await dbPut('coolers', { sn: generatedSN, name: document.getElementById('sr-model').value, fitter: 'Service Ticket Linked', date: pdate });

        alert(`Service Ticket Raised Successfully! Ticket No: ${ticketKey} at ${timestampNow}`);
        this.closeModal();
        this.navigate('service');
      }

      async renderCustomers(c) {
        let customers = await dbGetAll('customers');
        const uniqueMap = {};
        customers.forEach(cust => {
          let phoneKey = (cust.mobile && cust.mobile.trim() !== '' && cust.mobile !== 'NA') ? cust.mobile.trim() : ('NA_' + Math.random());
          uniqueMap[phoneKey] = cust;
        });
        const cleanCustomers = Object.values(uniqueMap);

        c.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <div class="flex justify-between items-center"><h3 class="font-bold text-sm">Customer Directory (Strictly Unique by Phone Number)</h3></div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-950 text-slate-400 font-mono uppercase border-b border-slate-800">
                  <tr><th class="p-3">Mobile Number (Primary ID)</th><th class="p-3">Customer Name</th><th class="p-3">Type</th><th class="p-3">Serial Code</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${cleanCustomers.length > 0 ? cleanCustomers.map(cust => `
                    <tr>
                      <td class="p-3 font-mono font-bold text-emerald-400 text-sm">${cust.mobile || 'NA'}</td>
                      <td class="p-3 font-bold text-slate-100">${cust.name || 'Valued Customer'}</td>
                      <td class="p-3"><span class="px-2 py-0.5 bg-purple-950 text-purple-300 rounded font-bold">${cust.type || 'Retailer'}</span></td>
                      <td class="p-3 font-mono text-sky-400 font-bold">${cust.coolerSn || 'N/A'}</td>
                    </tr>
                  `).join('') : `<tr><td colspan="4" class="p-4 text-center text-slate-500 italic">No customers registered yet.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      async renderInventory(c) {
        const inhouse = await dbGetAll('motors');
        const outsourced = await dbGetAll('outsourcedMotors');
        const freeInhouse = inhouse.filter(m => !m.coolerSn);
        const freeOutsourced = outsourced.filter(o => !o.coolerSn);

        c.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <div class="flex justify-between items-center">
              <div><h3 class="font-bold text-sm">Replacement Parts & Unassigned Stock</h3></div>
            </div>
            <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
              <span class="font-bold text-sky-400 text-xs">Unassigned In-House Motors Available (${freeInhouse.length})</span>
              <div class="flex flex-wrap gap-1">
                ${freeInhouse.length > 0 ? freeInhouse.map(m => `<span class="px-2 py-0.5 bg-sky-950 border border-sky-800 text-sky-300 rounded text-[10px] font-mono">SN: ${m.sn} (${m.model})</span>`).join('') : '<span class="text-slate-500 text-xs">All bound in coolers.</span>'}
              </div>
            </div>
            <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
              <span class="font-bold text-amber-400 text-xs">Unassigned Outsourced Motors Available (${freeOutsourced.length})</span>
              <div class="flex flex-wrap gap-1">
                ${freeOutsourced.length > 0 ? freeOutsourced.map(o => `<span class="px-2 py-0.5 bg-amber-950 border border-amber-800 text-amber-300 rounded text-[10px] font-mono">SN: ${o.outSn} (${o.vendorName})</span>`).join('') : '<span class="text-slate-500 text-xs">All bound in coolers.</span>'}
              </div>
            </div>
          </div>
        `;
      }

      openScannerModal(targetElemId = null, isBatchQueue = false) {
        this.activeScanTarget = targetElemId;
        document.getElementById('scanner-modal').classList.remove('hidden');
        
        setTimeout(() => {
          if (this.html5QrScanner) { this.html5QrScanner.clear().catch(() => {}); }
          this.html5QrScanner = new Html5Qrcode("qr-reader");
          this.html5QrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, (scannedText) => {
            if (this.html5QrScanner) {
              this.html5QrScanner.stop().then(() => {
                this.html5QrScanner.clear();
                this.html5QrScanner = null;
              }).catch(() => { this.html5QrScanner = null; });
            }
            document.getElementById('scanner-modal')?.classList.add('hidden');

            if (this.activeScanTarget) {
              const elem = document.getElementById(this.activeScanTarget);
              if (elem) {
                elem.value = scannedText;
                elem.dispatchEvent(new Event('input', { bubbles: true }));
                elem.dispatchEvent(new Event('change', { bubbles: true }));
                
                if (this.activeScanTarget === 'bm-scan-input') { app.addMotorToBatchQueue(); }
                else if (this.activeScanTarget === 'bc-scan-input') { app.addCoolerToBatchQueue(); }
              }
            } else {
              async function lookupScannedItem(code) {
                let foundMotor = await dbGet('motors', code);
                if (foundMotor) { alert(`Motor Found!\nSN: ${foundMotor.sn}\nModel: ${foundMotor.model}\nQC: ${foundMotor.qcStatus}`); return; }
                let foundOut = await dbGet('outsourcedMotors', code);
                if (foundOut) { alert(`Outsourced Motor Found!\nSN: ${foundOut.outSn}\nVendor: ${foundOut.vendorName}`); return; }
                let foundCooler = await dbGet('coolers', code);
                if (foundCooler) { alert(`Cooler Found!\nCode: ${foundCooler.sn}\nModel: ${foundCooler.model || foundCooler.name}\nQC: ${foundCooler.qcStatus}`); return; }
                alert(`Scanned Code: ${scannedText} (No record found)`);
              }
              lookupScannedItem(scannedText);
            }
          }).catch(() => {});
        }, 100);
      }

      closeScannerModal() {
        if (this.html5QrScanner) {
          try {
            this.html5QrScanner.stop().then(() => {
              this.html5QrScanner.clear();
              this.html5QrScanner = null;
            }).catch(() => { this.html5QrScanner = null; });
          } catch(e) { this.html5QrScanner = null; }
        }
        document.getElementById('scanner-modal')?.classList.add('hidden');
      }

      genSystemSN(targetId, prefix) {
        const generated = `${prefix}-${Math.floor(Math.random() * 89999 + 10000)}`;
        const elem = document.getElementById(targetId);
        if (elem) {
          elem.value = generated;
          elem.dispatchEvent(new Event('input', { bubbles: true }));
          elem.dispatchEvent(new Event('change', { bubbles: true }));
        }
      }

      generateAndShowQR(serviceCode, brandName) {
        document.getElementById('modal-qr-code').innerText = serviceCode;
        document.getElementById('modal-qr-cooler-name').innerText = brandName || 'NOVETECH AIR COOLER';
        const target = document.getElementById('modal-qrcode-target');
        target.innerHTML = '';
        try {
          new QRCode(target, { text: serviceCode, width: 140, height: 140, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
        } catch(e) {}
        this.openModal('qr-label-modal');
      }

      openModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
      closeModal(id = null) { 
        if(id) { document.getElementById(id)?.classList.add('hidden'); }
        const container = document.getElementById('dynamic-modal-container');
        if(container) container.innerHTML = ''; 
      }
    }

    const app = new EnterpriseApp();
    window.app = app;
    window.addEventListener('DOMContentLoaded', () => {
      app.init().then(() => {
        dbGet('users', 'admin').then(u => {
          if(!u) {
            dbPut('users', { name: 'admin', pass: 'admin123', role: 'ADMIN', fullname: 'System Administrator' });
          }
        });
      });
    });
  </script>
</body>
</html>
